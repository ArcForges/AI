name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  validate:
    name: Source and offline units
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check generated bindings
        run: |
          npm run types
          git diff --exit-code -- src/env.generated.d.ts
      - run: npm run check
      - name: Retain evaluated licence and source provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licence-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/licence-boundary.json
            artifacts/evidence/source-provenance.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Repository security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Validate workflow syntax
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  candidate:
    name: Build candidate
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - id: build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: ai-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify
    if: always()
    needs: [validate, quality, codeql, dependencies, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation gates
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$CANDIDATE_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCIES_RESULT" = success
          else
            test "$DEPENDENCIES_RESULT" = skipped
          fi

  deploy:
    name: Deploy Cloudflare
    needs: [verify, candidate]
    # Dependency review is intentionally skipped outside PRs. A status function
    # prevents that ancestor from implicitly skipping this verified deployment.
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.verify.result == 'success' &&
        needs.candidate.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    concurrency:
      group: cloudflare-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: artifacts/candidate
          merge-multiple: true
      - name: Confirm current main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$current_main" = "$GITHUB_SHA" || { echo 'This run was superseded on main; refusing to deploy an older commit.'; exit 1; }
      - name: Deploy the verified bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: cloudflare-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deployment/
          if-no-files-found: warn
          retention-days: 90
      - name: Archive the verified candidate
        working-directory: artifacts/candidate
        run: zip -q -r "$RUNNER_TEMP/ai-worker.zip" .
      - name: Create deployed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          printf 'Verified private Cloudflare Hello Agent. The attached candidate was deployed without rebuilding and completed the provider deployment operation. Runtime inference was not tested by CI.\n\nSource: %s\nCI: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-notes.md"
          gh release create "ai-$CANDIDATE_VERSION" "$RUNNER_TEMP/ai-worker.zip" artifacts/candidate/candidate.json artifacts/deployment/deployment.json --target "$GITHUB_SHA" --prerelease --title "AI $CANDIDATE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

  delivery:
    name: Verify deployment
    needs: [deploy]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful Cloudflare deployment
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          test "$DEPLOY_RESULT" = success || {
            echo "::error::Cloudflare deployment must complete successfully on main (received $DEPLOY_RESULT)."
            exit 1
          }
