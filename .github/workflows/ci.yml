name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  # HAR.40 (authorized retirement of arcforges-ai-hello): main no longer
  # deploys. The Worker and Workflow stay deployed until retire-cloudflare.yml
  # deletes them by workflow_dispatch and verifies 404.
  validate:
    name: Source and offline units
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check generated bindings
        run: |
          npm run types
          git diff --exit-code -- src/env.generated.d.ts
      - run: npm run check
      - name: Retain evaluated licence and source provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: licence-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/evidence/licence-boundary.json
            artifacts/evidence/source-provenance.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Repository security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Validate workflow syntax
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  candidate:
    name: Build candidate
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - id: build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: ai-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify
    if: always()
    needs: [validate, quality, codeql, dependencies, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all validation gates
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$CODEQL_RESULT" = success
          test "$CANDIDATE_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCIES_RESULT" = success
          else
            test "$DEPENDENCIES_RESULT" = skipped
          fi
